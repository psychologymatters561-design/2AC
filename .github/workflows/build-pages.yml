name: Build generated pages

# The service and location pages are generated from build.py plus the
# content_*.py modules. Regenerating them here keeps the committed HTML in
# step with the sources without anyone having to run the build by hand.

on:
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "build.py"
      - "build_all.py"
      - "build_experience.py"
      - "content_*.py"
      - "src/experience.*"
      - "index.html"
      - "normalize_pages.py"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore logo.png from git history
        run: |
          # logo.png is binary and cannot be written through the contents API,
          # but the original is still reachable in this repository's history.
          # Restoring it from there keeps the full-resolution original rather
          # than shipping a re-encoded copy, and the checksum makes a wrong
          # blob fail the build.
          if [ ! -f logo.png ]; then
            git checkout ec4dddf8c59bf0ef13e14b168abdcacdba68fcee -- logo.png
          fi
          want=65a41568815fef2abcbbb84a676226e87f54722bf2e0cdb24aaefa0b257b1c8e
          got=$(sha256sum logo.png | awk '{print $1}')
          if [ "$want" != "$got" ]; then
            echo "logo.png checksum mismatch: expected $want, got $got"
            exit 1
          fi
          echo "logo.png restored ($(stat -c%s logo.png) bytes)"

      - name: Generate pages
        run: python3 build_all.py

      - name: Normalise hand-written pages
        run: python3 normalize_pages.py

      - name: Verify the scroll experience assembled intact
        run: |
          # experience.html is assembled from src/; a truncated or corrupted
          # transfer would still produce a file, so check the hash.
          want=b65fd96aad4975615fc937c2447dd0375215f2ba6596ca70030e4c3f9d3e0cab
          got=$(sha256sum experience.html | awk '{print $1}')
          if [ "$want" != "$got" ]; then
            echo "experience.html checksum mismatch: expected $want, got $got"
            exit 1
          fi
          echo "experience.html verified ($(stat -c%s experience.html) bytes)"

      - name: Verify output
        run: |
          python3 - <<'EOF'
          import glob, json, re, sys
          from html.parser import HTMLParser

          VOID = {'meta','link','img','br','hr','input','source','area',
                  'base','col','embed','param','track','wbr'}

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack = []; self.bad = False
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append(t)
              def handle_endtag(self, t):
                  if t in VOID: return
                  if not self.stack: self.bad = True; return
                  if self.stack[-1] == t: self.stack.pop()
                  elif t in self.stack:
                      while self.stack and self.stack[-1] != t: self.stack.pop()
                      if self.stack: self.stack.pop()
                  else: self.bad = True

          fail = []
          for f in sorted(glob.glob('ac-*.html')):
              h = open(f, encoding='utf-8').read()
              p = P(); p.feed(h)
              if p.bad or p.stack: fail.append(f + ': html nesting')
              if h.count('<h1') != 1: fail.append(f + ': h1 count')
              for m in re.finditer(r'<script[^>]*ld\+json[^>]*>(.*?)</script>', h, re.S):
                  try: json.loads(m.group(1))
                  except Exception: fail.append(f + ': bad json-ld')
              for m in re.finditer(r'<style[^>]*>(.*?)</style>', h, re.S):
                  if m.group(1).count('{') != m.group(1).count('}'):
                      fail.append(f + ': css braces')
              body = re.sub(r'<script.*?</script>|<style.*?</style>', '',
                            h[h.find('<body'):], flags=re.S)
              if re.search(r'\bHVAC\b', re.sub(r'<[^>]+>', ' ', body), re.I):
                  fail.append(f + ': visible HVAC')

          if fail:
              print('FAILED:'); [print(' ', x) for x in fail]; sys.exit(1)
          print('all generated pages passed verification')
          EOF

      - name: Commit regenerated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' logo.png
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Regenerate pages and restore logo [skip ci]"
            git push
          fi
